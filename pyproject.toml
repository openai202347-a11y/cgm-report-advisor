[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgm-report-advisor"
version = "0.1.0"
description = "A reusable pipeline skeleton for reading CGM graphic reports, collecting missing clinical intake, and drafting sourced diet and activity advice."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "The cgm-report-advisor authors" }]
# No third-party runtime dependencies in v0.1.
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Healthcare Industry",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
dev = []

[project.scripts]
cgm-report-advisor = "cgm_report_advisor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cgm_report_advisor = ["py.typed"]
